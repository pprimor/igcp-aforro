name = "igcp-aforro-api"
main = "src/index.ts"
compatibility_date = "2025-05-15"

# Production route. A DNS record for api.igcp-aforro.primor.me already exists in
# the primor.me zone, so we bind the Worker with a zone route rather than
# `custom_domain = true` (which refuses to adopt a hostname that already has
# externally-managed DNS records — Cloudflare error 100117). The zone route
# coexists with the existing (proxied) record and routes its traffic to this
# Worker. This is the hostname the /health smoke test in deploy-api.yml checks;
# the route was previously commented out, so the domain never reached the Worker
# and the smoke test failed the SSL handshake on every deploy.
routes = [{ pattern = "api.igcp-aforro.primor.me/*", zone_name = "primor.me" }]

[observability]
enabled = true
