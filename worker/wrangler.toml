name = "igcp-aforro-api"
main = "src/index.ts"
compatibility_date = "2025-05-15"

# Production custom domain. A plain zone route can't get a valid cert here:
# api.igcp-aforro.primor.me is two labels under the apex, so the free Universal
# SSL wildcard (*.primor.me) doesn't cover it and the TLS handshake fails. A
# Workers Custom Domain sidesteps that — it generates a per-hostname certificate
# automatically (no paid Advanced Certificate Manager subscription) and creates
# the DNS record itself. Prerequisite: no pre-existing DNS record for this
# hostname, or wrangler fails with Cloudflare error 100117; delete the old
# record in the dashboard before the first deploy with this config.
routes = [{ pattern = "api.igcp-aforro.primor.me", custom_domain = true }]

[observability]
enabled = true
