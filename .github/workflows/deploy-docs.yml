name: Deploy docs

# Builds the Astro Starlight docs against a specific git ref and ships the
# result to Cloudflare Pages at https://igcp-aforro.primor.me. Release-tag
# deploys also publish a versioned rates.json snapshot.
#
# Triggered two ways:
#   - workflow_call from Release (immediately after a new version is published)
#   - workflow_dispatch (deploy any branch, SHA, or past tag without publishing npm)

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to deploy (e.g. main, a commit SHA, or v2026.428.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (e.g. main, a commit SHA, or v2026.428.0)
        required: true
        default: main
        type: string

concurrency:
  # Serialize Pages deploys so two runs don't race against the same Cloudflare
  # project. `cancel-in-progress: false` lets in-flight deploys finish.
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy docs + rates.json to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-pages
      url: https://igcp-aforro.primor.me
    env:
      # cloudflare/wrangler-action@v3 still declares the Node 20 action runtime.
      # Opt in to the Node 24 runner behavior early so the workflow stays warning-free.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout deploy ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0

      - name: Setup Node.js
        # Astro >=5 requires Node >=22.12. Library code targets Node >=20 (per
        # package.json `engines`), but this job only builds the docs site, so
        # bumping just this job to 22 is the minimal fix.
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (root)
        run: pnpm install --frozen-lockfile

      - name: Build library (needed for typedoc API reference)
        run: pnpm build

      - name: Rebuild rates.json against deploy ref
        # build-rates-json.ts reads VERSION from src/index.ts, which the
        # release workflow pins before calling this workflow for tags.
        run: pnpm build:rates-json

      - name: Install docs dependencies
        # docs/ has its own lockfile and is not in pnpm-workspace.yaml; without
        # --ignore-workspace pnpm walks up and only refreshes the root workspace.
        working-directory: docs
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Build docs site
        working-directory: docs
        run: pnpm build

      - name: Stage Pages artifact (docs + rates.json)
        # rates.json is ~43 MB raw, over the Pages per-file limit, so it ships
        # pre-gzipped as rates.json.gz. Pages ignores Content-Encoding set via
        # _headers (it served the gzip bytes as plain application/json), so
        # the public /rates.json and /v/<ver>/rates.json URLs are answered by
        # Pages Functions in worker/functions/ that stream the .gz asset back
        # with Content-Encoding: gzip and their own Cache-Control headers.
        env:
          DEPLOY_REF: ${{ inputs.ref }}
          # Cloudflare Pages rejects static assets above 25 MiB per file.
          PAGES_MAX_FILE_BYTES: 26214400
        run: |
          set -euo pipefail

          stage_gzipped_rates() {
            local src="$1"
            local dest="$2"
            mkdir -p "$(dirname "$dest")"
            gzip -9 -c "$src" > "$dest"
            local size
            size="$(wc -c < "$dest")"
            if (( size > PAGES_MAX_FILE_BYTES )); then
              echo "::error::${dest} is ${size} bytes after gzip (Pages limit ${PAGES_MAX_FILE_BYTES}). Split the artifact or host it off Pages."
              exit 1
            fi
            echo "Staged ${dest} ($(numfmt --to=iec "$size") gzip)"
          }

          # The .gz suffix is load-bearing: the Functions map <path> to <path>.gz.
          stage_gzipped_rates public/rates.json docs/dist/rates.json.gz
          if [[ "${DEPLOY_REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            version="${DEPLOY_REF#v}"
            stage_gzipped_rates public/rates.json "docs/dist/v/${version}/rates.json.gz"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from worker/ so pnpm can resolve wrangler (see deploy-api.yml).
          # Without this, the action tries `pnpm add wrangler` at the workspace
          # root and fails with ERR_PNPM_ADDING_TO_ROOT.
          # This cwd also decides where the Pages Functions live: `wrangler
          # pages deploy` has no flag for it and compiles `<cwd>/functions`
          # (never a directory inside the deployed output), so the rates.json
          # Functions sit in worker/functions/. If the cwd moves, move them too,
          # or /rates.json silently 404s.
          workingDirectory: worker
          # `--branch=main` makes this a production deployment (any other
          # branch name would produce a preview URL). `--commit-dirty=true`
          # silences the "uncommitted changes" warning since the staging step
          # above writes the gzip-compressed rates.json.gz files into docs/dist.
          command: pages deploy ../docs/dist --project-name=igcp-aforro --branch=main --commit-dirty=true
