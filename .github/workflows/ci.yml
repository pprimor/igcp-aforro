name: CI

# PR + push gate. Runs the same three commands the maintainer runs locally
# (`pnpm lint`, `pnpm typecheck`, `pnpm test`) plus a build smoke-check so
# `tsup` config drift is caught before the release workflow tries to ship.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-flight run for the same ref when a new commit lands. Saves
# CI minutes on rapid `git push --force-with-lease` review cycles.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (vitest)
        run: pnpm test

      - name: Build (tsup)
        run: pnpm build
