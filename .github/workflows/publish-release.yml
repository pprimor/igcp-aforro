name: Publish release

# Publishes only after a temporary release PR is merged into `main`.
# This keeps branch protection intact: the version bump goes through PR CI,
# then the accepted `main` commit is published to npm and, only once that
# succeeds, tagged and released.
#
# Two entry points:
#   - `pull_request: closed` on a merged `release/*` branch — the manual code
#     release path driven by release.yml.
#   - `workflow_dispatch` — used by data-refresh.yml, which bumps the version
#     inside its own PR and dispatches this workflow after self-merging. That
#     merge is authored by GITHUB_TOKEN, and GitHub does not fire workflows from
#     token-authored events, so the `pull_request` trigger would never see it.
#
# The dispatch path skips only the release-branch-name assertion below (HEAD_REF
# is empty). The substantive guards still apply: package.json must agree with
# src/index.ts, and neither the tag nor the npm version may already exist.
#
# npm auth is trusted publishing (OIDC): npmjs.com trusts this workflow file
# (`publish-release.yml` in pprimor/igcp-aforro), so no token secret is used
# and nothing expires. Provenance is attached automatically.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Main ref to publish from
        required: true
        default: main
        type: string

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write       # tag + GitHub Release
  id-token: write       # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    name: Publish, tag, release
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      npmTag: ${{ steps.version.outputs.npmTag }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        env:
          HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
            import { readFileSync, appendFileSync } from 'node:fs';

            const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
            const version = pkg.version;
            const index = readFileSync('src/index.ts', 'utf8');
            const match = index.match(/export const VERSION = '([^']+)';/);

            if (!match) {
              throw new Error('Could not find VERSION export in src/index.ts.');
            }
            if (match[1] !== version) {
              throw new Error(`package.json version (${version}) does not match src/index.ts VERSION (${match[1]}).`);
            }

            const headRef = process.env.HEAD_REF;
            if (headRef && headRef !== `release/${version}`) {
              throw new Error(`Merged release branch ${headRef} does not match package version ${version}.`);
            }

            const tag = `v${version}`;
            const npmTag = version.includes('-') ? 'next' : 'latest';
            appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `npmTag=${npmTag}\n`);
            console.log(`Publishing ${version} (tag=${tag}, npm=${npmTag})`);
          EOF

      - name: Ensure release is new
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists. Clean it up before publishing this release."
            exit 1
          fi
          if npm view "igcp-aforro@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::igcp-aforro@${VERSION} is already published to npm."
            exit 1
          fi

      # `npm publish` rather than `pnpm publish`: npm's OIDC exchange is the
      # documented trusted-publishing path. The root package has no
      # `workspace:` dependencies, so pnpm's publish-time rewriting isn't needed.
      - name: Publish to npm
        run: |
          set -euo pipefail
          npm publish --access public --tag "${{ steps.version.outputs.npmTag }}"

      # Tagged only after the publish succeeds: a failed publish must not leave
      # an orphan tag, because "Ensure release is new" would refuse every rerun.
      # Residual case: if the publish succeeds but this push fails, a rerun is
      # refused because the version is already on npm. Recovery is to push the
      # tag manually and create the GitHub Release. Likewise, if the tag is
      # pushed but `gh release create` fails, a rerun is refused because the tag
      # exists; recover with `gh release create <tag>`, then dispatch deploy-docs
      # and deploy-api manually.
      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "Release ${VERSION}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          NPM_TAG: ${{ steps.version.outputs.npmTag }}
        run: |
          set -euo pipefail
          args=(--title "${TAG}" --generate-notes)
          if [[ "${NPM_TAG}" == "next" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${TAG}" "${args[@]}"

  deploy-docs:
    name: Deploy docs
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    uses: ./.github/workflows/deploy-docs.yml
    with:
      ref: ${{ needs.publish.outputs.tag }}
    secrets: inherit

  # The Worker bundles `src/data` at build time exactly like the npm package
  # does, so it serves stale rates until it is redeployed. Deploying from the
  # release tag (not `main`) keeps the API, the docs, and the published package
  # on identical data.
  deploy-api:
    name: Deploy API
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    uses: ./.github/workflows/deploy-api.yml
    with:
      ref: ${{ needs.publish.outputs.tag }}
    secrets: inherit

  # Surfaces a failed publish or deploy as a GitHub issue. This workflow is
  # usually dispatched by the daily data refresh, so nobody is watching the run.
  # `failure()` is true when any needed job failed; when `publish` fails the
  # deploy jobs are skipped, which still counts. A run where nothing failed
  # (including a closed-unmerged PR, where every job is skipped) reports nothing.
  report-failure:
    name: Report failure
    needs: [publish, deploy-docs, deploy-api]
    if: ${{ failure() }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/report-failure.yml
    with:
      title: Publish release failed
      details: "Release version: ${{ needs.publish.outputs.version || 'unknown (failed before version was resolved)' }}"
