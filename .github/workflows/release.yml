name: Release

# Manually-triggered release preparation: bumps the CalVer
# (YYYY.MMDD.PATCH) version and opens a temporary release PR. Publishing,
# tagging, and docs deployment happen after that PR is merged to `main`.
#
# This is the path for **code** releases and hot-fixes. The monthly rate
# refresh does not come through here: data-refresh.yml bumps the version inside
# its own PR and dispatches "Publish release" directly after merging, so fresh
# IGCP rates reach npm without anyone remembering to run this workflow.
#
# `bumpKind` semantics (implemented in scripts/compute-next-version.ts, shared
# with data-refresh.yml; see igcp-aforro_library_e6bcf217.plan.md):
#   - today      -> `<UTC year>.<MMDD-as-int>.0` (e.g. 2026-04-20 -> 2026.420.0).
#                   Use this for the regular monthly Euribor refresh release.
#   - patch      -> Same date segment as the current package.json version,
#                   patch incremented by 1. Use for same-day hot-fixes
#                   (2026.420.0 -> 2026.420.1).
#   - prerelease -> `<today>.0-rc.<N>`, published with the npm dist-tag `next`
#                   so consumers don't pick it up by default.

on:
  workflow_dispatch:
    inputs:
      bumpKind:
        description: How to compute the next version
        required: true
        type: choice
        default: today
        options:
          - today
          - patch
          - prerelease
      dryRun:
        description: Run all steps except npm publish, git push, and Pages deploy
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Prepare release PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need full history so the workflow can verify release tags.
          fetch-depth: 0
          # The release branch push must use RELEASE_TOKEN. If checkout keeps
          # the default GITHUB_TOKEN credential, git authenticates as
          # github-actions[bot] and branch protection rejects the push.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Compute and apply next version
        # Shared with data-refresh.yml so the two release paths can never
        # disagree on the CalVer arithmetic. Emits version/tag/npmTag as step
        # outputs via GITHUB_OUTPUT.
        #
        # Computing and writing in a single invocation is deliberate: a second
        # call could straddle UTC midnight and derive a different date segment
        # than the one this step reported, leaving the branch name and tag
        # disagreeing with the version actually written to package.json.
        #
        # `src/index.ts` exports a hardcoded VERSION used by the static
        # rates.json artifact, and publish-release.yml refuses to publish when
        # it disagrees with package.json, so both files are written together.
        # The script edits only the version line in each, which leaves Biome's
        # formatting intact — no follow-up formatter step needed.
        id: version
        run: pnpm version:next --bump "${{ inputs.bumpKind }}" --write

      - name: Validate release target
        # Runs after the bump because nothing is pushed until the PR step
        # below, so an invalid target still costs only a failed runner.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists. Pick another bump kind or clean up the stale tag first."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "release/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Branch release/${VERSION} already exists."
            exit 1
          fi

      - name: Show dry-run diff
        if: ${{ inputs.dryRun }}
        run: git diff -- package.json src/index.ts

      - name: Create release PR
        if: ${{ !inputs.dryRun }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: release/${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TOKEN}" ]]; then
            echo "::error::Missing RELEASE_TOKEN secret. Use a fine-grained PAT with Contents and Pull requests write access so the generated PR triggers CI."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "${BRANCH}"
          git add package.json src/index.ts
          git commit -m "release: ${VERSION}"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "release: ${VERSION}" \
            --body "$(cat <<EOF
          Prepares release ${VERSION}.

          After this PR is merged, the Publish release workflow will tag v${VERSION}, publish to npm, create the GitHub Release, and deploy docs.
          EOF
          )"
