name: Release

# Manually-triggered release preparation: bumps the CalVer
# (YYYY.MMDD.PATCH) version and opens a temporary release PR. Publishing,
# tagging, and docs deployment happen after that PR is merged to `main`.
#
# `bumpKind` semantics (see igcp-aforro_library_e6bcf217.plan.md):
#   - today      -> `<UTC year>.<MMDD-as-int>.0` (e.g. 2026-04-20 -> 2026.420.0).
#                   Use this for the regular monthly Euribor refresh release.
#   - patch      -> Same date segment as the current package.json version,
#                   patch incremented by 1. Use for same-day hot-fixes
#                   (2026.420.0 -> 2026.420.1).
#   - prerelease -> `<today>.0-rc.<N>`, published with the npm dist-tag `next`
#                   so consumers don't pick it up by default.

on:
  workflow_dispatch:
    inputs:
      bumpKind:
        description: How to compute the next version
        required: true
        type: choice
        default: today
        options:
          - today
          - patch
          - prerelease
      dryRun:
        description: Run all steps except npm publish, git push, and Pages deploy
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Prepare release PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need full history so `git tag` can verify uniqueness and the
          # auto-generated GitHub Release notes can diff against the
          # previous tag.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Compute next version
        id: version
        env:
          BUMP_KIND: ${{ inputs.bumpKind }}
        run: |
          set -euo pipefail
          # Heredoc is single-quoted ('EOF') so bash performs no expansion;
          # node sees the script verbatim, which keeps JS template literals
          # and regex backslashes readable.
          node --input-type=module <<'EOF'
            import { readFileSync, appendFileSync } from 'node:fs';

            const bumpKind = process.env.BUMP_KIND;
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
            const current = pkg.version;

            const now = new Date();
            const y = now.getUTCFullYear();
            const mmdd = (now.getUTCMonth() + 1) * 100 + now.getUTCDate();
            const todayBase = `${y}.${mmdd}`;

            const stableCurrent = current.split('-')[0];
            const [cy, cmd, cp] = stableCurrent.split('.');
            const currentBase = `${cy}.${cmd}`;
            const currentPatch = Number(cp);

            let next;
            let npmTag = 'latest';
            if (bumpKind === 'today') {
              if (currentBase === todayBase && !current.includes('-')) {
                next = `${todayBase}.${currentPatch + 1}`;
              } else {
                next = `${todayBase}.0`;
              }
            } else if (bumpKind === 'patch') {
              next = `${currentBase}.${currentPatch + 1}`;
            } else if (bumpKind === 'prerelease') {
              let rc = 0;
              const m = current.match(/-rc\.(\d+)$/);
              if (m && stableCurrent === `${todayBase}.0`) {
                rc = Number(m[1]) + 1;
              }
              next = `${todayBase}.0-rc.${rc}`;
              npmTag = 'next';
            } else {
              throw new Error(`unknown bumpKind: ${bumpKind}`);
            }

            const tag = `v${next}`;
            appendFileSync(process.env.GITHUB_OUTPUT, `version=${next}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `npmTag=${npmTag}\n`);
            console.log(`current=${current} -> next=${next} (tag=${tag}, npm=${npmTag})`);
          EOF

      - name: Validate release target
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists. Pick another bump kind or clean up the stale tag first."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "release/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Branch release/${VERSION} already exists."
            exit 1
          fi

      - name: Bump package.json
        run: |
          set -euo pipefail
          pnpm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Sync VERSION constant in src/index.ts
        # `src/index.ts` exports a hardcoded VERSION used by the static
        # rates.json artifact. Keep it in lockstep with package.json so the
        # published library and the Pages-served rates.json agree.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
            import { readFileSync, writeFileSync } from 'node:fs';
            const path = 'src/index.ts';
            const next = process.env.VERSION;
            const before = readFileSync(path, 'utf8');
            const after = before.replace(
              /export const VERSION = '[^']+';/,
              `export const VERSION = '${next}';`,
            );
            if (before === after) {
              throw new Error(`Failed to update VERSION in ${path}; pattern did not match.`);
            }
            writeFileSync(path, after);
          EOF

      - name: Reformat bumped files
        # `pnpm version` rewrites package.json with multi-line arrays, which
        # Biome's formatter rejects. Run Biome's formatter on the touched
        # files so the release PR starts from a clean formatter state.
        run: pnpm exec biome format --write package.json src/index.ts

      - name: Show dry-run diff
        if: ${{ inputs.dryRun }}
        run: git diff -- package.json src/index.ts

      - name: Create release PR
        if: ${{ !inputs.dryRun }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: release/${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TOKEN}" ]]; then
            echo "::error::Missing RELEASE_TOKEN secret. Use a fine-grained PAT with Contents and Pull requests write access so the generated PR triggers CI."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "${BRANCH}"
          git add package.json src/index.ts
          git commit -m "release: ${VERSION}"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "release: ${VERSION}" \
            --body "$(cat <<EOF
          Prepares release ${VERSION}.

          After this PR is merged, the Publish release workflow will tag v${VERSION}, publish to npm, create the GitHub Release, and deploy docs.
          EOF
          )"
