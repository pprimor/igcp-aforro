name: Data refresh

# Daily refresh of the bundled Euribor 3M dataset (Bundesbank BBIG1) and
# the IGCP-published Série F base-rate fixture used by golden tests.
#
# Cron schedule rationale (see igcp-aforro_euribor_followups_c8d4f1a2.plan.md):
# GitHub Actions interprets `cron:` in UTC and ignores `TZ`. To stay at
# 08:00 Lisbon all year despite Portugal's DST shift between WET (UTC+0,
# winter) and WEST (UTC+1, summer), we register both UTC hours; a gate
# step below skips the wrong one so only a single run fetches and pushes.
# Without that gate, both crons would update the same PR branch and the
# second `git push --force-with-lease` can fail on GitHub's side.
#
# Job logic:
# 1. Run fetch-euribor.ts in incremental mode (always-full-series fetch,
#    client-side merge — the Bundesbank endpoint silently ignores
#    startPeriod/endPeriod on this dataflow).
# 2. Run fetch-igcp-base-rates.ts for the current month (idempotent;
#    no-op when the value already matches the fixture).
# 3. When the current month's IGCP rate is published, run `pnpm test`
#    so a drift between our formula and the freshly-published IGCP base
#    rate fails the workflow loudly (the resulting PR is still opened,
#    but with `needs-review` so a human inspects).
# 4. Open / update a PR via peter-evans/create-pull-request only when
#    the current-month IGCP publication is present or a maintainer forced
#    a PR; log and skip Euribor-only diffs otherwise.
# 5. Auto-merge clean data-refresh PRs only when the current month's
#    IGCP-published rate was fetched and all guard checks pass.
# 6. Freshness gate (independent of the diff): fail the job if the
#    latest Euribor observation is older than today - 5 calendar days.
#    That tolerates a Friday + long weekend + a German holiday; longer
#    silences are real upstream problems worth a human eyeball.

on:
  schedule:
    # Winter: 08:00 UTC == 08:00 WET   (late Oct -> late Mar)
    - cron: '0 8 * * *'
    # Summer: 07:00 UTC == 08:00 WEST  (late Mar -> late Oct)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      forcePr:
        description: Open the PR even when no data files changed (debug)
        required: false
        type: boolean
        default: false

# One refresh at a time — cancel a queued/in-flight run when another starts.
concurrency:
  group: data-refresh
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    name: Fetch Euribor + IGCP, open PR on drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Lisbon
    steps:
      - name: Skip duplicate DST cron
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          hour=$(TZ=Europe/Lisbon date +%H)
          if [ "${hour}" != "08" ]; then
            echo "Skipping: ${hour}:xx Europe/Lisbon (only 08:00 runs the refresh)."
            exit 0
          fi
          echo "08:xx Europe/Lisbon — proceeding with scheduled refresh."

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Euribor (incremental)
        # pnpm 10 forwards trailing args directly to the script, so no
        # `--` separator is needed (and including one would be passed
        # through verbatim and rejected by parseArgs in fetch-euribor.ts).
        run: pnpm fetch:euribor --mode incremental

      - name: Fetch IGCP base rate (current month)
        run: pnpm fetch:igcp-base-rates --month current

      - name: Read refresh metadata
        id: meta
        run: |
          set -euo pipefail
          if [ ! -f src/data/_meta.json ]; then
            echo "src/data/_meta.json missing after fetch" >&2
            exit 1
          fi
          latest=$(node -p "(() => { const m = JSON.parse(require('fs').readFileSync('src/data/_meta.json','utf8')); const a = m.euribor.latestObservation; const b = (m.euribor12m && m.euribor12m.latestObservation) || a; if (a && b) return a < b ? a : b; return a || b || ''; })()")
          upstream=$(node -p "JSON.parse(require('fs').readFileSync('src/data/_meta.json','utf8')).euribor.upstreamLastUpdate ?? 'unknown'")
          today=$(date -u +%F)
          {
            echo "latest=${latest}"
            echo "upstream=${upstream}"
            echo "today=${today}"
            echo "month=$(date -u +%Y-%m)"
          } >> "$GITHUB_OUTPUT"
          echo "Latest observation: ${latest} (upstream last update: ${upstream}, today: ${today})"

      - name: Freshness gate (latest observation must be within 5 days)
        env:
          LATEST: ${{ steps.meta.outputs.latest }}
          TODAY: ${{ steps.meta.outputs.today }}
        run: |
          set -euo pipefail
          # GNU date arithmetic on the runner — diff in seconds, divide.
          latest_ts=$(date -u -d "${LATEST}" +%s)
          today_ts=$(date -u -d "${TODAY}" +%s)
          age_days=$(( (today_ts - latest_ts) / 86400 ))
          echo "Euribor latestObservation is ${age_days} day(s) behind today"
          if [ "${age_days}" -gt 5 ]; then
            echo "::error title=Stale Euribor data::latestObservation=${LATEST} is ${age_days} days behind today (>5d SLO)."
            exit 1
          fi

      - name: Detect data file changes
        id: diff
        env:
          FORCE_PR: ${{ inputs.forcePr }}
        run: |
          set -euo pipefail
          # Restrict the diff probe to the files our fetchers can write.
          # `git status --porcelain` returns empty when there is nothing.
          changed=$(git status --porcelain -- \
            src/data/euribor3m.json \
            src/data/euribor12m.json \
            src/data/_meta.json \
            raw/euribor \
            tests/fixtures/igcpPublishedBaseRates.json \
            raw/igcp || true)
          igcp_notice="raw/igcp/${{ steps.meta.outputs.month }}.html"
          if [ -n "${changed}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            echo "${changed}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data file changes."
          fi
          if printf '%s\n' "${changed}" | grep -qF 'tests/fixtures/igcpPublishedBaseRates.json' \
            && printf '%s\n' "${changed}" | grep -qF "${igcp_notice}"; then
            echo "igcp_published=true" >> "$GITHUB_OUTPUT"
            echo "Current-month IGCP publication detected: ${igcp_notice}"
          else
            echo "igcp_published=false" >> "$GITHUB_OUTPUT"
            echo "No current-month IGCP publication change detected."
          fi
          if [ "${FORCE_PR}" = "true" ]; then
            echo "pr_eligible=true" >> "$GITHUB_OUTPUT"
            echo "PR eligible because workflow_dispatch forcePr is true."
          elif printf '%s\n' "${changed}" | grep -qF 'tests/fixtures/igcpPublishedBaseRates.json' \
            && printf '%s\n' "${changed}" | grep -qF "${igcp_notice}"; then
            echo "pr_eligible=true" >> "$GITHUB_OUTPUT"
            echo "PR eligible because the current-month IGCP publication is present."
          else
            echo "pr_eligible=false" >> "$GITHUB_OUTPUT"
            echo "PR not eligible until the current-month IGCP publication is present."
          fi

      - name: Log skipped Euribor-only changes
        if: ${{ steps.diff.outputs.changed == 'true' && steps.diff.outputs.igcp_published != 'true' && !inputs.forcePr }}
        run: |
          echo "::notice title=Skipping data-refresh PR::Data files changed, but the current-month IGCP publication was not fetched yet. Euribor-only diffs are left on the runner and no PR is opened until IGCP publishes the monthly base rate."

      - name: Run golden tests (gate before opening PR)
        id: tests
        if: ${{ steps.diff.outputs.pr_eligible == 'true' }}
        continue-on-error: true
        run: pnpm test

      - name: Pick PR labels
        if: ${{ steps.diff.outputs.pr_eligible == 'true' }}
        id: labels
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          if [ "${TESTS_OUTCOME}" = "success" ]; then
            echo "labels=data-refresh" >> "$GITHUB_OUTPUT"
          else
            echo "labels=data-refresh,needs-review" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update PR
        id: cpr
        if: ${{ steps.diff.outputs.pr_eligible == 'true' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: data-refresh/${{ steps.meta.outputs.month }}
          base: main
          delete-branch: true
          commit-message: |
            data: refresh Euribor + IGCP for ${{ steps.meta.outputs.month }}

            Latest Euribor observation: ${{ steps.meta.outputs.latest }}
            Upstream last update: ${{ steps.meta.outputs.upstream }}
            Tests: ${{ steps.tests.outcome }}
          title: 'data: refresh Euribor + IGCP for ${{ steps.meta.outputs.month }}'
          labels: ${{ steps.labels.outputs.labels }}
          body: |
            Automated daily data refresh.

            **Latest Euribor observation:** `${{ steps.meta.outputs.latest }}`
            **Bundesbank `last update`:** `${{ steps.meta.outputs.upstream }}`
            **Today (UTC):** `${{ steps.meta.outputs.today }}`
            **Golden test outcome:** `${{ steps.tests.outcome }}`

            Files this PR may touch:
            - `src/data/euribor3m.json`
            - `src/data/euribor12m.json`
            - `src/data/_meta.json`
            - `raw/euribor/<YYYY-MM>.csv`
            - `tests/fixtures/igcpPublishedBaseRates.json`
            - `raw/igcp/<YYYY-MM>.html`

            If the `needs-review` label is present, `pnpm test` failed against
            the refreshed data — typically the IGCP-published base rate
            disagrees with what `computeBaseRate()` derives from Euribor.
            Investigate before merging.

      - name: Check auto-merge eligibility
        id: automerge
        if: ${{ steps.cpr.outputs.pull-request-number != '' && steps.diff.outputs.igcp_published == 'true' && steps.tests.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          EXPECTED_BRANCH: data-refresh/${{ steps.meta.outputs.month }}
          EXPECTED_MONTH: ${{ steps.meta.outputs.month }}
        run: |
          set -euo pipefail
          pr_json=$(gh pr view "${PR_NUMBER}" --json author,files,headRefName,isDraft,labels,mergeable,mergeStateStatus,state)
          PR_JSON="${pr_json}" node --input-type=module <<'EOF'
            import { appendFileSync } from 'node:fs';

            const outputPath = process.env.GITHUB_OUTPUT;
            const pr = JSON.parse(process.env.PR_JSON);
            const expectedBranch = process.env.EXPECTED_BRANCH;
            const expectedMonth = process.env.EXPECTED_MONTH;
            const expectedIgcpRaw = `raw/igcp/${expectedMonth}.html`;

            function writeOutput(name, value) {
              appendFileSync(outputPath, `${name}=${value}\n`);
            }

            function ineligible(reason) {
              writeOutput('eligible', 'false');
              writeOutput('reason', reason);
              console.log(`Auto-merge disabled: ${reason}`);
              process.exit(0);
            }

            const labels = new Set(pr.labels.map((label) => label.name));
            const files = pr.files.map((file) => file.path);
            const allowedFiles = files.filter((path) =>
              path === 'src/data/euribor3m.json' ||
              path === 'src/data/euribor12m.json' ||
              path === 'src/data/_meta.json' ||
              path === 'tests/fixtures/igcpPublishedBaseRates.json' ||
              path === expectedIgcpRaw ||
              (path.startsWith('raw/euribor/') && path.endsWith('.csv')),
            );
            const disallowedFiles = files.filter((path) => !allowedFiles.includes(path));

            if (pr.state !== 'OPEN') ineligible(`PR is ${pr.state}`);
            if (pr.isDraft) ineligible('PR is a draft');
            if (pr.headRefName !== expectedBranch) {
              ineligible(`unexpected branch ${pr.headRefName}`);
            }
            if (!['app/github-actions', 'github-actions[bot]'].includes(pr.author.login)) {
              ineligible(`unexpected author ${pr.author.login}`);
            }
            if (!labels.has('data-refresh')) ineligible('missing data-refresh label');
            if (labels.has('needs-review')) ineligible('needs-review label present');
            if (disallowedFiles.length > 0) {
              ineligible(`unexpected files: ${disallowedFiles.join(', ')}`);
            }
            if (!files.includes('tests/fixtures/igcpPublishedBaseRates.json')) {
              ineligible('missing IGCP fixture change');
            }
            if (!files.includes(expectedIgcpRaw)) {
              ineligible(`missing current-month IGCP raw HTML: ${expectedIgcpRaw}`);
            }

            writeOutput('eligible', 'true');
            writeOutput('reason', 'eligible');
            console.log(`Auto-merge eligible: ${files.join(', ')}`);
          EOF

      # Squash-merge immediately: golden tests already ran in this job.
      # `--auto` waits for ci.yml, but PRs opened via GITHUB_TOKEN do not
      # trigger other workflows, so auto-merge would stall indefinitely.
      - name: Merge eligible data-refresh PR
        if: ${{ steps.automerge.outputs.eligible == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          gh pr merge "${PR_NUMBER}" --squash --delete-branch

      - name: Fail job if tests failed
        if: ${{ steps.diff.outputs.pr_eligible == 'true' && steps.tests.outcome == 'failure' }}
        run: |
          echo "::error title=Golden tests failed against refreshed data::See the create-pull-request step for the PR with the needs-review label."
          exit 1
